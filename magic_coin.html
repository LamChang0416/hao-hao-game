<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>阿布魔法金庫 🪙</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<link rel="manifest" href="manifest.json">
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&family=Noto+Sans+TC:wght@900&display=swap');
body, html {
    margin: 0; padding: 0;
    width: 100vw; min-height: 100vh;
    font-family: 'Nunito', 'Noto Sans TC', sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
    color: white;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
}
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1rem; }
.hidden { display: none !important; }

.btn {
    background: linear-gradient(135deg, #f59e0b, #ea580c);
    color: white; font-weight: 900; font-size: 1.5rem;
    padding: 1rem 2rem; border-radius: 9999px;
    border: none; cursor: pointer;
    box-shadow: 0 8px 0 #9a3412, 0 15px 20px rgba(0,0,0,0.4);
    transition: all 0.1s; width: 100%; max-width: 300px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.3);
}
.btn:active { transform: translateY(8px); box-shadow: 0 0px 0 #9a3412, 0 5px 10px rgba(0,0,0,0.4); }
.btn-ghost {
    background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3);
    color: white; padding: 0.75rem 1.5rem; border-radius: 9999px;
    font-weight: 900; font-size: 1.2rem; margin-top: 1rem;
}

.coin {
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-weight: 900; box-shadow: inset 0 -4px 0 rgba(0,0,0,0.3), 0 4px 8px rgba(0,0,0,0.4);
    position: absolute; cursor: pointer;
}
.coin-10 {
    width: 70px; height: 70px; font-size: 2rem;
    background: linear-gradient(135deg, #fbbf24, #d97706);
    border: 3px solid #fef3c7; color: #78350f;
}
.coin-1 {
    width: 50px; height: 50px; font-size: 1.5rem;
    background: linear-gradient(135deg, #94a3b8, #475569);
    border: 2px solid #e2e8f0; color: white;
}
.coin.selected {
    box-shadow: 0 0 0 4px #4ade80, 0 0 20px #4ade80;
    transform: scale(1.1);
}
.coin.disabled { filter: grayscale(100%) opacity(0.5); pointer-events: none; }

.zone {
    background: rgba(255,255,255,0.05); border: 3px dashed rgba(255,255,255,0.2);
    border-radius: 24px; position: relative;
}
.zone-title {
    position: absolute; top: -15px; left: 50%; transform: translateX(-50%);
    background: #1e1b4b; padding: 0 15px; font-weight: 900; font-size: 1.2rem;
    color: #a78bfa; border: 2px solid rgba(255,255,255,0.2); border-radius: 99px;
}

.bubble {
    background: white; color: #1e293b; border-radius: 20px; padding: 12px 20px;
    font-size: 1.2rem; font-weight: 900; box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    position: relative; max-width: 300px;
}
.bubble::before {
    content: ''; position: absolute; bottom: -10px; left: 30px;
    border-width: 10px 10px 0; border-style: solid; border-color: white transparent transparent transparent;
}

.bob { animation: bob 2s infinite ease-in-out; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

/* Virtual Keyboard */
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 300px; margin-top: 1rem; }
.keypad-btn {
    background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.2);
    border-radius: 12px; padding: 15px 0; font-size: 1.8rem; font-weight: 900; color: white;
}
.keypad-btn:active { background: rgba(255,255,255,0.3); }
.keypad-btn.action { background: rgba(74,222,128,0.2); color: #4ade80; border-color: #4ade80; }

.equation {
    font-size: 3.5rem; font-weight: 900; letter-spacing: 5px;
    text-shadow: 0 0 20px rgba(167,139,250,0.5); display: flex; align-items: center; justify-content: center; gap: 15px;
}
.eq-num { color: #fcd34d; }
.eq-op { color: white; }
.eq-ans { color: #4ade80; border-bottom: 4px solid #4ade80; min-width: 80px; text-align: center; display: inline-block; }

</style>
</head>
<body>

<!-- PWA Home Button -->
<a href="index.html" style="position: fixed; top: 15px; left: 15px; z-index: 99999; background: rgba(15, 23, 42, 0.6); color: white; padding: 8px 16px; border-radius: 999px; font-size: 16px; text-decoration: none; font-weight: 900; backdrop-filter: blur(8px); border: 2px solid rgba(255,255,255,0.2);">
  🏠 返回
</a>

<!-- Start Screen -->
<div id="screen-start" class="screen">
    <div class="text-7xl mb-6 bob">🪙</div>
    <h1 class="text-4xl md:text-5xl font-black mb-8 text-center text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-yellow-600 drop-shadow-lg">
        阿布的魔法金庫
    </h1>
    <p class="text-xl text-purple-200 font-bold mb-10 text-center max-w-md">
        進位與退位的終極挑戰！<br>幫阿布整理金幣，超過 10 個銀幣可以合成金幣，不夠時可以打破金幣！
    </p>
    
    <div class="flex flex-col gap-4 w-full items-center">
        <button class="btn" onclick="startMode('add')">➕ 魔法合成 (加法)</button>
        <button class="btn" style="background: linear-gradient(135deg, #3b82f6, #1d4ed8); box-shadow: 0 8px 0 #1e3a8a, 0 15px 20px rgba(0,0,0,0.4);" onclick="startMode('sub')">➖ 魔法碎裂 (減法)</button>
    </div>
</div>

<!-- Game Screen -->
<div id="screen-game" class="screen hidden" style="justify-content: flex-start; padding-top: 2rem;">
    <!-- Top Area: Equation -->
    <div class="equation mb-6" id="equation-display">
        <span class="eq-num" id="eq-n1">15</span>
        <span class="eq-op" id="eq-op">+</span>
        <span class="eq-num" id="eq-n2">8</span>
        <span class="eq-op">=</span>
        <span class="eq-ans" id="eq-ans">?</span>
    </div>

    <!-- Play Area -->
    <div class="flex w-full max-w-2xl gap-4 flex-1 mb-4 relative" id="play-area">
        <!-- Tens Zone -->
        <div class="zone flex-1 flex flex-col items-center" id="zone-10">
            <div class="zone-title">十位數 (10元)</div>
        </div>
        <!-- Ones Zone -->
        <div class="zone flex-[1.5] flex flex-col items-center" id="zone-1">
            <div class="zone-title">個位數 (1元)</div>
        </div>
    </div>

    <!-- Bottom Area: Abu & Actions -->
    <div class="w-full max-w-2xl flex flex-col md:flex-row items-center gap-4 relative z-10 bg-slate-900/50 p-4 rounded-3xl backdrop-blur-md">
        <div class="flex items-center gap-4">
            <div class="bob cursor-pointer" onclick="pokeAbu()">
                <svg width="80" height="80" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="45" fill="#333" />
                    <!-- Crown -->
                    <path d="M 30 25 L 50 10 L 70 25 Z" fill="#fbbf24" />
                    <circle cx="35" cy="45" r="7" fill="white" /><circle cx="36" cy="45" r="3" fill="black" />
                    <circle cx="65" cy="45" r="7" fill="white" /><circle cx="64" cy="45" r="3" fill="black" />
                    <path d="M 45 55 L 55 55 L 50 65 Z" fill="#fbbf24" />
                </svg>
            </div>
            <div class="bubble" id="abu-msg">我們來算算看吧！</div>
        </div>

        <div class="flex-1 flex justify-end w-full">
            <button id="btn-action" class="btn hidden text-xl py-3 px-6 w-full md:w-auto" onclick="handleAction()">合併 10 個銀幣</button>
            <div id="keypad-container" class="hidden w-full">
                <div class="flex justify-between items-center bg-slate-800 p-2 rounded-2xl w-full">
                    <span class="font-bold text-slate-400 pl-4">答案是：</span>
                    <div class="flex gap-2">
                        <button class="bg-slate-700 text-white font-bold text-xl w-12 h-12 rounded-xl" onclick="inputDigit(1)">1</button>
                        <button class="bg-slate-700 text-white font-bold text-xl w-12 h-12 rounded-xl" onclick="inputDigit(2)">2</button>
                        <button class="bg-slate-700 text-white font-bold text-xl w-12 h-12 rounded-xl" onclick="inputDigit(3)">3</button>
                        <button class="bg-slate-700 text-white font-bold text-xl w-12 h-12 rounded-xl" onclick="inputDigit(4)">4</button>
                        <button class="bg-slate-700 text-white font-bold text-xl w-12 h-12 rounded-xl" onclick="inputDigit(5)">5</button>
                        <!-- To make it fit on screen, let's use a simpler approach: Just a direct plus/minus or a small grid -->
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Keypad Overlay -->
<div id="keypad-overlay" class="absolute inset-0 bg-slate-900/90 z-50 flex flex-col items-center justify-center hidden backdrop-blur-md">
    <div class="text-3xl font-bold mb-4">輸入答案：<span id="kp-display" class="text-green-400 border-b-4 border-green-400 min-w-[60px] inline-block text-center"></span></div>
    <div class="keypad">
        <button class="keypad-btn" onclick="kp(1)">1</button>
        <button class="keypad-btn" onclick="kp(2)">2</button>
        <button class="keypad-btn" onclick="kp(3)">3</button>
        <button class="keypad-btn" onclick="kp(4)">4</button>
        <button class="keypad-btn" onclick="kp(5)">5</button>
        <button class="keypad-btn" onclick="kp(6)">6</button>
        <button class="keypad-btn" onclick="kp(7)">7</button>
        <button class="keypad-btn" onclick="kp(8)">8</button>
        <button class="keypad-btn" onclick="kp(9)">9</button>
        <button class="keypad-btn text-red-400" onclick="kp('C')">C</button>
        <button class="keypad-btn" onclick="kp(0)">0</button>
        <button class="keypad-btn action" onclick="kp('OK')">OK</button>
    </div>
    <button class="btn-ghost mt-8" onclick="document.getElementById('keypad-overlay').classList.add('hidden')">返回查看硬幣</button>
</div>

<!-- Victory Screen -->
<div id="screen-victory" class="screen hidden">
    <div class="text-8xl mb-6">🏆</div>
    <h1 class="text-5xl font-black mb-4 text-green-400">太棒了！</h1>
    <p class="text-2xl font-bold mb-8 text-center" id="victory-msg">你已經掌握了進退位的魔法！</p>
    <button class="btn mb-4" onclick="nextQuestion()">下一題 🌟</button>
    <button class="btn-ghost" onclick="location.reload()">回主選單</button>
</div>

<script>
// Audio context
function speak(text) {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-TW';
    u.rate = 1.0;
    window.speechSynthesis.speak(u);
    document.getElementById('abu-msg').textContent = text;
}

function pokeAbu() {
    speak("加油喔！有阿布陪你算！");
    gsap.fromTo("#abu-msg", {scale: 0.9}, {scale: 1, duration: 0.2, ease: "back.out(2)"});
}

// Game State
let state = {
    mode: '', // 'add' or 'sub'
    n1: 0,
    n2: 0,
    ans: 0,
    step: '',
    coins: [] // {id, type: 10 or 1, el, x, y, active}
};

let kpValue = '';

// Generator
function genProblem() {
    if (state.mode === 'add') {
        // Needs carrying: ones sum > 9
        let o1 = Math.floor(Math.random() * 5) + 5; // 5~9
        let o2 = Math.floor(Math.random() * 5) + 5; // 5~9
        let t1 = Math.floor(Math.random() * 3) + 1; // 1~3
        let t2 = Math.floor(Math.random() * 2); // 0~1
        state.n1 = t1 * 10 + o1;
        state.n2 = t2 * 10 + o2;
        state.ans = state.n1 + state.n2;
    } else {
        // Needs borrowing: n1 ones < n2 ones
        let t1 = Math.floor(Math.random() * 3) + 2; // 2~4
        let o1 = Math.floor(Math.random() * 5); // 0~4
        let o2 = Math.floor(Math.random() * 4) + 5; // 5~8 (ensures o1 < o2)
        let t2 = Math.floor(Math.random() * (t1 - 1)); // 0 to t1-1 (ensures n1 > n2)
        state.n1 = t1 * 10 + o1;
        state.n2 = t2 * 10 + o2;
        state.ans = state.n1 - state.n2;
    }
}

function startMode(m) {
    state.mode = m;
    document.getElementById('screen-start').classList.add('hidden');
    document.getElementById('screen-game').classList.remove('hidden');
    nextQuestion();
}

function nextQuestion() {
    document.getElementById('screen-victory').classList.add('hidden');
    document.getElementById('screen-game').classList.remove('hidden');
    genProblem();
    
    document.getElementById('eq-n1').textContent = state.n1;
    document.getElementById('eq-op').textContent = state.mode === 'add' ? '+' : '-';
    document.getElementById('eq-n2').textContent = state.n2;
    document.getElementById('eq-ans').textContent = '?';
    
    clearCoins();
    spawnInitialCoins();
    
    if (state.mode === 'add') {
        state.step = 'add_show';
        speak(`這題是 ${state.n1} 加上 ${state.n2}！我先把 ${state.n1} 個金幣放好。`);
        setTimeout(() => {
            speak(`接著天上掉下來 ${state.n2} 個金幣！`);
            spawnAddCoins();
            setTimeout(checkCarryNeed, 2500);
        }, 3000);
    } else {
        state.step = 'sub_start';
        speak(`這題是 ${state.n1} 減掉 ${state.n2}！我們有 ${state.n1} 元，要減去 ${state.n2} 元。個位數夠不夠減呢？`);
        setTimeout(checkBorrowNeed, 3000);
    }
}

let coinIdCounter = 0;

function clearCoins() {
    state.coins.forEach(c => c.el.remove());
    state.coins = [];
}

function createCoinEl(type, text) {
    const el = document.createElement('div');
    el.className = `coin coin-${type}`;
    el.textContent = text || (type === 10 ? '10' : '1');
    return el;
}

function addCoin(type, zoneId) {
    const zone = document.getElementById(zoneId);
    const rect = zone.getBoundingClientRect();
    const el = createCoinEl(type);
    
    // Random position within zone, avoiding edges
    const padding = 40;
    const cw = type === 10 ? 70 : 50;
    
    let x = padding + Math.random() * (rect.width - padding*2 - cw);
    let y = padding + 20 + Math.random() * (rect.height - padding*2 - cw - 20);
    
    el.style.left = `${x}px`;
    el.style.top = `${y}px`;
    
    zone.appendChild(el);
    
    const coinObj = { id: coinIdCounter++, type, el, x, y, active: true, zoneId };
    state.coins.push(coinObj);
    
    gsap.fromTo(el, {scale: 0, opacity: 0, y: y - 50}, {scale: 1, opacity: 1, y: y, duration: 0.5, ease: "back.out(2)"});
    return coinObj;
}

function spawnInitialCoins() {
    let t = Math.floor(state.n1 / 10);
    let o = state.n1 % 10;
    
    for(let i=0; i<t; i++) addCoin(10, 'zone-10');
    for(let i=0; i<o; i++) addCoin(1, 'zone-1');
}

function spawnAddCoins() {
    let t = Math.floor(state.n2 / 10);
    let o = state.n2 % 10;
    
    // Drop them from top
    for(let i=0; i<t; i++) {
        setTimeout(() => addCoin(10, 'zone-10'), i * 300);
    }
    for(let i=0; i<o; i++) {
        setTimeout(() => addCoin(1, 'zone-1'), (t + i) * 300);
    }
}

function checkCarryNeed() {
    const ones = state.coins.filter(c => c.type === 1 && c.active);
    if (ones.length >= 10) {
        state.step = 'wait_carry';
        speak(`哇！個位數有 ${ones.length} 個 1 元耶！超過 10 個了，請點擊下方的「魔法合成」按鈕！`);
        const btn = document.getElementById('btn-action');
        btn.textContent = '✨ 魔法合成 10 個銀幣';
        btn.classList.remove('hidden');
        btn.onclick = doCarry;
    } else {
        promptAnswer();
    }
}

function doCarry() {
    document.getElementById('btn-action').classList.add('hidden');
    speak("魔法合成！10個1元變成1個10元囉！");
    
    const ones = state.coins.filter(c => c.type === 1 && c.active).slice(0, 10);
    ones.forEach(c => c.active = false);
    
    // Animate to center of zone-1, then merge
    const zone1 = document.getElementById('zone-1');
    const rect1 = zone1.getBoundingClientRect();
    const cx = rect1.width / 2;
    const cy = rect1.height / 2;
    
    ones.forEach((c, i) => {
        gsap.to(c.el, {
            left: cx - 25, top: cy - 25, 
            duration: 0.8, ease: "power2.in",
            onComplete: () => {
                if (i === 9) {
                    // Create burst
                    confetti({particleCount: 30, spread: 50, origin: {x: 0.7, y: 0.5}});
                    ones.forEach(co => co.el.remove());
                    // Spawn 10 coin in zone 10
                    addCoin(10, 'zone-10');
                    setTimeout(promptAnswer, 1500);
                }
            }
        });
    });
}

function checkBorrowNeed() {
    const o1 = state.n1 % 10;
    const o2 = state.n2 % 10;
    
    if (o1 < o2) {
        state.step = 'wait_borrow';
        speak(`個位數只有 ${o1} 個，不夠減 ${o2} 個耶！請點擊一顆 10 元金幣，把它「敲碎」借給個位數！`);
        
        // Make 10 coins pulse
        const tens = state.coins.filter(c => c.type === 10 && c.active);
        tens.forEach(c => {
            c.el.classList.add('selected', 'bob');
            c.el.onclick = () => doBorrow(c);
        });
    } else {
        // Normal sub, not really used based on generator, but just in case
        promptSubAction();
    }
}

function doBorrow(coinObj) {
    if (state.step !== 'wait_borrow') return;
    
    // Remove pulse/click from all tens
    const tens = state.coins.filter(c => c.type === 10 && c.active);
    tens.forEach(c => {
        c.el.classList.remove('selected', 'bob');
        c.el.onclick = null;
    });
    
    coinObj.active = false;
    speak("碰！1個10元碎成10個1元了！");
    
    // Animate coin explosion
    gsap.to(coinObj.el, {
        scale: 1.5, opacity: 0, duration: 0.4,
        onComplete: () => {
            confetti({particleCount: 50, spread: 80, origin: {x: 0.3, y: 0.5}});
            coinObj.el.remove();
            
            // Spawn 10 ones in zone 1
            for(let i=0; i<10; i++) {
                setTimeout(() => addCoin(1, 'zone-1'), i * 100);
            }
            
            setTimeout(promptSubAction, 2000);
        }
    });
}

function promptSubAction() {
    state.step = 'wait_sub_remove';
    speak(`現在個位數夠減了！我們要減去 ${state.n2}，請點擊下方的「移除」按鈕！`);
    
    const btn = document.getElementById('btn-action');
    btn.textContent = `💥 移除 ${state.n2} 元`;
    btn.classList.remove('hidden');
    btn.onclick = doSubRemove;
}

function doSubRemove() {
    document.getElementById('btn-action').classList.add('hidden');
    speak(`魔法移除！扣掉 ${state.n2} 元囉！`);
    
    let t2 = Math.floor(state.n2 / 10);
    let o2 = state.n2 % 10;
    
    const activeTens = state.coins.filter(c => c.type === 10 && c.active);
    const activeOnes = state.coins.filter(c => c.type === 1 && c.active);
    
    const toRemove = [
        ...activeTens.slice(0, t2),
        ...activeOnes.slice(0, o2)
    ];
    
    toRemove.forEach((c, i) => {
        c.active = false;
        gsap.to(c.el, {
            y: c.el.offsetTop + 200, opacity: 0, scale: 0.5,
            duration: 0.6, delay: i * 0.1, ease: "power1.in",
            onComplete: () => {
                c.el.remove();
                if (i === toRemove.length - 1) {
                    setTimeout(promptAnswer, 1000);
                }
            }
        });
    });
}

function promptAnswer() {
    state.step = 'wait_ans';
    speak("算好囉！現在盤子上總共剩下多少錢呢？點擊按鈕輸入答案！");
    
    const btn = document.getElementById('btn-action');
    btn.textContent = `⌨️ 輸入答案`;
    btn.classList.remove('hidden');
    btn.onclick = () => {
        kpValue = '';
        document.getElementById('kp-display').textContent = '';
        document.getElementById('keypad-overlay').classList.remove('hidden');
    };
}

// Keypad logic
function kp(val) {
    if (val === 'C') {
        kpValue = '';
    } else if (val === 'OK') {
        checkAnswer();
        return;
    } else {
        if (kpValue.length < 3) kpValue += val;
    }
    document.getElementById('kp-display').textContent = kpValue;
}

function checkAnswer() {
    const userAns = parseInt(kpValue, 10);
    if (isNaN(userAns)) return;
    
    document.getElementById('keypad-overlay').classList.add('hidden');
    
    if (userAns === state.ans) {
        document.getElementById('eq-ans').textContent = state.ans;
        document.getElementById('btn-action').classList.add('hidden');
        speak(`答對了！答案就是 ${state.ans}！澔澔太棒了！`);
        confetti({particleCount: 150, spread: 100, origin: {y: 0.6}});
        
        setTimeout(() => {
            document.getElementById('screen-game').classList.add('hidden');
            document.getElementById('screen-victory').classList.remove('hidden');
        }, 2500);
    } else {
        speak("哎呀，好像不太對喔！我們再數數看盤子上的金幣吧！");
        document.getElementById('eq-ans').textContent = '?';
        document.getElementById('eq-ans').classList.add('text-red-400');
        gsap.fromTo("#eq-ans", {x: -10}, {x: 10, duration: 0.1, yoyo: true, repeat: 3, onComplete:() => {
            document.getElementById('eq-ans').classList.remove('text-red-400');
        }});
    }
}

// Prevent touch scroll
document.addEventListener('touchmove', function(e) { e.preventDefault(); }, { passive: false });

</script>
