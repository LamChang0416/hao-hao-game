<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>阿布程式大冒險 🧩</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- GSAP for smooth animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="abu_voice.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&family=Noto+Sans+TC:wght@800;900&display=swap');
        
        body, html {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            overflow: hidden;
            font-family: 'Nunito', 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            touch-action: none; user-select: none; -webkit-user-select: none;
        }

        /* Top HUD */
        .glass-hud {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
        }

        /* Grid Map */
        #map-container {
            position: relative;
            width: 90vw; max-width: 500px;
            aspect-ratio: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 4px solid #6366f1;
            border-radius: 16px;
            display: grid;
            gap: 2px;
            padding: 4px;
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.3);
            margin: 20px auto;
        }

        .grid-cell {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            display: flex; justify-content: center; align-items: center;
            font-size: 2rem;
        }
        .grid-cell.wall { background: #475569; }

        /* A-Bu Character on Map */
        #abu-sprite {
            position: absolute;
            width: calc(100% / 5 - 8px);
            height: calc(100% / 5 - 8px);
            z-index: 10;
            display: flex; justify-content: center; align-items: center;
            font-size: 2.5rem;
            transition: transform 0.4s ease-in-out;
        }

        /* Command Blocks */
        #command-palette {
            display: flex; gap: 10px; justify-content: center; padding: 10px;
        }
        .cmd-block {
            background: linear-gradient(to bottom, #818cf8, #4f46e5);
            color: white; border-radius: 12px; padding: 10px 20px;
            font-weight: 900; font-size: 1.2rem; cursor: pointer;
            box-shadow: 0 6px 0 #312e81;
            transition: all 0.1s;
        }
        .cmd-block:active { transform: translateY(4px); box-shadow: 0 2px 0 #312e81; }
        
        .cmd-fwd { background: linear-gradient(to bottom, #34d399, #059669); box-shadow: 0 6px 0 #064e3b; }
        .cmd-left { background: linear-gradient(to bottom, #f472b6, #db2777); box-shadow: 0 6px 0 #831843; }
        .cmd-right { background: linear-gradient(to bottom, #60a5fa, #2563eb); box-shadow: 0 6px 0 #1e3a8a; }

        /* Sequence Board */
        #sequence-board {
            display: flex; gap: 8px; justify-content: flex-start; align-items: center;
            background: rgba(0,0,0,0.3); border-radius: 16px; padding: 15px;
            min-height: 80px; overflow-x: auto; margin: 0 20px;
            border: 2px dashed #6366f1;
        }
        .seq-item {
            background: white; border-radius: 8px; padding: 8px 12px;
            font-size: 1.5rem; display: flex; align-items: center; gap: 5px;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }
        @keyframes popIn { 0% { transform: scale(0); } 100% { transform: scale(1); } }

        /* Chat Bubble */
        .chat-bubble {
            background: white; border-radius: 20px; padding: 10px 15px;
            font-weight: 900; color: #1e1b4b; position: relative; max-width: 250px;
        }
        .chat-bubble::after {
            content: ''; position: absolute; left: -10px; top: 50%; transform: translateY(-50%);
            border-width: 8px 10px 8px 0; border-style: solid; border-color: transparent white transparent transparent;
        }

        #start-screen { background: radial-gradient(circle at center, #4f46e5, #1e1b4b); }
        .btn-action {
            background: linear-gradient(to bottom, #fbbf24, #d97706);
            box-shadow: 0 8px 0 0 #92400e; color: white;
        }
        .btn-action:active { transform: translateY(6px); box-shadow: 0 2px 0 0 #92400e; }
    </style>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e1b4b">
</head>
<body class="flex flex-col">

<a href="index.html" style="position: fixed; top: 20px; right: 20px; z-index: 99999; background: rgba(255,255,255,0.2); color: white; padding: 10px 20px; border-radius: 9999px; font-size: 18px; text-decoration: none; font-weight: 900; backdrop-filter: blur(10px); border: 2px solid rgba(255,255,255,0.4);" oncontextmenu="return false;">🏠 回大世界</a>

    <!-- HUD -->
    <div class="glass-hud w-full p-4 flex items-center justify-between z-20">
        <div class="flex items-center gap-4">
            <div class="w-16 h-16 bg-white rounded-full flex items-center justify-center text-4xl shadow-lg border-4 border-indigo-300 cursor-pointer" onclick="speak('澔澔，寫好程式後按下執行，讓我走到星星那裡！')">
                🐦
            </div>
            <div class="chat-bubble" id="abu-dialog">寫程式囉！排好指令，按執行！</div>
        </div>
        <div class="text-yellow-400 text-2xl font-black tracking-widest bg-indigo-900/50 px-4 py-2 rounded-full border-2 border-indigo-500" id="level-display">關卡 1</div>
    </div>

    <!-- Map Area -->
    <div class="flex-grow flex flex-col justify-center items-center relative">
        <div id="map-container">
            <!-- Grid generated by JS -->
            <div id="abu-sprite">🚀</div>
        </div>
    </div>

    <!-- Sequence Board -->
    <div class="w-full flex justify-between items-center px-5 mb-2">
        <div class="text-indigo-200 font-bold">阿布的指令列 (點擊移除)：</div>
        <div class="flex gap-2">
            <button onclick="clearSequence()" class="bg-rose-500 text-white font-bold py-1 px-4 rounded-full shadow-[0_4px_0_#be123c] active:translate-y-1 active:shadow-[0_0px_0_#be123c]">清空</button>
            <button onclick="executeSequence()" class="bg-green-500 text-white font-black py-1 px-6 rounded-full shadow-[0_4px_0_#15803d] active:translate-y-1 active:shadow-[0_0px_0_#15803d] text-xl">▶ 執行</button>
        </div>
    </div>
    
    <div id="sequence-board">
        <!-- Sequence items go here -->
    </div>

    <!-- Command Palette -->
    <div id="command-palette" class="bg-indigo-950/80 pb-8 pt-4 rounded-t-3xl border-t-4 border-indigo-500 mt-4">
        <button class="cmd-block cmd-fwd flex flex-col items-center" onclick="addCmd('fwd', '前進')">
            <span class="text-2xl">⬆️</span><span>前進</span>
        </button>
        <button class="cmd-block cmd-left flex flex-col items-center" onclick="addCmd('left', '左轉')">
            <span class="text-2xl">↩️</span><span>左轉</span>
        </button>
        <button class="cmd-block cmd-right flex flex-col items-center" onclick="addCmd('right', '右轉')">
            <span class="text-2xl">↪️</span><span>右轉</span>
        </button>
    </div>

    <!-- Start Screen -->
    <div id="start-screen" class="absolute inset-0 z-[100] flex flex-col items-center justify-center text-center p-8">
        <h1 class="text-5xl sm:text-7xl font-black text-white drop-shadow-2xl mb-4">阿布程式探險</h1>
        <p class="text-2xl sm:text-3xl text-indigo-200 font-bold mb-12">邏輯大師 🧩</p>
        <button onclick="initGame()" class="btn-action text-4xl font-black px-16 py-6 rounded-full">開始闖關！</button>
    </div>

    <!-- Victory Pop-up -->
    <div id="victory-screen" class="hidden absolute inset-0 z-[200] flex flex-col items-center justify-center bg-indigo-900/90 backdrop-blur-md p-6">
        <div class="text-[120px] mb-4 animate-bounce">🌟</div>
        <h2 class="text-5xl font-black text-yellow-300 mb-8 drop-shadow-lg">程式正確！</h2>
        <button onclick="nextLevel()" class="btn-action text-3xl font-black px-12 py-4 rounded-full">下一關 🔥</button>
    </div>

    <script>
        const GRID_SIZE = 5;
        let currentLevel = 1;
        const totalLevels = 5;
        
        let abuPos = { x: 0, y: 0 };
        let abuDir = 0; // 0: Right, 1: Down, 2: Left, 3: Up
        let targetPos = { x: 4, y: 4 };
        let walls = [];
        let sequence = [];
        let isExecuting = false;

        const levels = [
            { start: {x:0, y:0}, dir:0, target: {x:3, y:0}, walls: [] },
            { start: {x:0, y:0}, dir:0, target: {x:2, y:2}, walls: [{x:1, y:0}, {x:1, y:1}] },
            { start: {x:0, y:4}, dir:0, target: {x:4, y:0}, walls: [{x:2, y:4}, {x:2, y:3}, {x:2, y:2}] },
            { start: {x:2, y:2}, dir:3, target: {x:0, y:0}, walls: [{x:1, y:2}, {x:2, y:1}] },
            { start: {x:0, y:0}, dir:0, target: {x:4, y:4}, walls: [{x:1, y:0}, {x:1, y:2}, {x:3, y:2}, {x:3, y:4}] }
        ];

        function initGame() {
            document.getElementById('start-screen').style.display = 'none';
            loadLevel(1);
        }

        function loadLevel(level) {
            currentLevel = level;
            document.getElementById('level-display').innerText = `關卡 ${level}`;
            const lvData = levels[level - 1];
            
            abuPos = { ...lvData.start };
            abuDir = lvData.dir;
            targetPos = { ...lvData.target };
            walls = [...lvData.walls];
            sequence = [];
            
            renderMap();
            updateSequenceUI();
            updateAbuVisuals();
            
            if(window.speak) window.speak(`第 ${level} 關開始！排好指令讓我走到星星那邊！`);
        }

        function renderMap() {
            const container = document.getElementById('map-container');
            // Remove existing cells
            container.querySelectorAll('.grid-cell').forEach(e => e.remove());
            
            container.style.gridTemplateColumns = `repeat(${GRID_SIZE}, 1fr)`;
            container.style.gridTemplateRows = `repeat(${GRID_SIZE}, 1fr)`;

            for(let y=0; y<GRID_SIZE; y++) {
                for(let x=0; x<GRID_SIZE; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'grid-cell';
                    
                    if (walls.some(w => w.x === x && w.y === y)) {
                        cell.classList.add('wall');
                        cell.innerText = '☄️';
                    } else if (targetPos.x === x && targetPos.y === y) {
                        cell.innerText = '⭐';
                        cell.style.filter = "drop-shadow(0 0 10px #fbbf24)";
                        cell.classList.add('animate-pulse');
                    }
                    container.appendChild(cell);
                }
            }
        }

        function updateAbuVisuals(animate = false) {
            const sprite = document.getElementById('abu-sprite');
            // Calculate % position
            const xPct = (abuPos.x / GRID_SIZE) * 100;
            const yPct = (abuPos.y / GRID_SIZE) * 100;
            const rot = abuDir * 90; // 0=0deg, 1=90deg, 2=180deg, 3=270deg

            if(animate) {
                gsap.to(sprite, { left: `${xPct}%`, top: `${yPct}%`, rotation: rot, duration: 0.4, ease: "power1.inOut" });
            } else {
                gsap.killTweensOf(sprite);
                gsap.set(sprite, { left: `${xPct}%`, top: `${yPct}%`, rotation: rot });
            }
        }

        function addCmd(type, label) {
            if(isExecuting) return;
            if(sequence.length >= 10) {
                if(window.speak) window.speak("指令箱滿囉！先執行看看吧！");
                return;
            }
            let icon = type==='fwd' ? '⬆️' : type==='left' ? '↩️' : '↪️';
            sequence.push({ type, label, icon });
            updateSequenceUI();
            
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            const actx = new AudioCtx();
            const osc = actx.createOscillator(); osc.connect(actx.destination);
            osc.frequency.value = 800 + sequence.length*50;
            osc.start(); osc.stop(actx.currentTime + 0.05);
        }

        function removeCmd(index) {
            if(isExecuting) return;
            sequence.splice(index, 1);
            updateSequenceUI();
        }

        function clearSequence() {
            if(isExecuting) return;
            sequence = [];
            updateSequenceUI();
        }

        function updateSequenceUI() {
            const board = document.getElementById('sequence-board');
            board.innerHTML = '';
            sequence.forEach((cmd, i) => {
                const el = document.createElement('div');
                el.className = 'seq-item';
                el.innerHTML = `<span>${cmd.icon}</span>`;
                el.onclick = () => removeCmd(i);
                board.appendChild(el);
            });
            if(sequence.length === 0) {
                board.innerHTML = '<span class="text-indigo-300 opacity-50">點擊下方按鈕加入指令...</span>';
            }
        }

        async function executeSequence() {
            if(isExecuting || sequence.length === 0) return;
            isExecuting = true;
            
            // Reset to start first just in case
            const lvData = levels[currentLevel - 1];
            abuPos = { ...lvData.start };
            abuDir = lvData.dir;
            updateAbuVisuals(false);
            
            if(window.speak) window.speak("程式啟動！");
            await sleep(500);

            const items = document.querySelectorAll('.seq-item');

            for(let i=0; i<sequence.length; i++) {
                const cmd = sequence[i];
                
                // Highlight UI
                items.forEach(el => el.style.border = 'none');
                if(items[i]) items[i].style.border = '3px solid #fbbf24';

                if(cmd.type === 'fwd') {
                    let nx = abuPos.x; let ny = abuPos.y;
                    if(abuDir===0) nx++; else if(abuDir===1) ny++;
                    else if(abuDir===2) nx--; else if(abuDir===3) ny--;
                    
                    // Check bounds and walls
                    if(nx<0 || nx>=GRID_SIZE || ny<0 || ny>=GRID_SIZE || walls.some(w=>w.x===nx && w.y===ny)) {
                        // Crash
                        gsap.to('#abu-sprite', { x: "+=10", yoyo: true, repeat: 3, duration: 0.05 });
                        if(window.speak) window.speak("哎呀！撞到了！程式有錯誤喔！(Bug)");
                        items.forEach(el => el.style.border = 'none');
                        isExecuting = false;
                        setTimeout(() => resetAbu(), 1500);
                        return;
                    } else {
                        abuPos.x = nx; abuPos.y = ny;
                    }
                } else if(cmd.type === 'left') {
                    abuDir = (abuDir - 1 + 4) % 4;
                } else if(cmd.type === 'right') {
                    abuDir = (abuDir + 1) % 4;
                }

                updateAbuVisuals(true);
                await sleep(500);
            }

            items.forEach(el => el.style.border = 'none');

            // Check Win
            if(abuPos.x === targetPos.x && abuPos.y === targetPos.y) {
                handleVictory();
            } else {
                if(window.speak) window.speak("程式跑完了，但是沒有抵達星星喔！再檢查看看指令順序！");
                isExecuting = false;
                setTimeout(() => resetAbu(), 2000);
            }
        }

        function resetAbu() {
            const lvData = levels[currentLevel - 1];
            abuPos = { ...lvData.start };
            abuDir = lvData.dir;
            updateAbuVisuals(true);
        }

        function handleVictory() {
            confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
            if(window.speak) window.speak("過關！澔澔是超厲害的程式小天才！");
            setTimeout(() => {
                document.getElementById('victory-screen').classList.remove('hidden');
                isExecuting = false;
            }, 1000);
        }

        function nextLevel() {
            document.getElementById('victory-screen').classList.add('hidden');
            currentLevel++;
            if (currentLevel > totalLevels) {
                if(window.speak) window.speak("哇！你完成了所有的程式挑戰！太棒了！");
                currentLevel = 1;
            }
            loadLevel(currentLevel);
        }

        const sleep = ms => new Promise(r => setTimeout(r, ms));

        // Fix layout on resize
        window.addEventListener('resize', () => updateAbuVisuals(false));
    </script>
</body>
</html>
