<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>阿布魔法注音積木 🔠</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="abu_voice.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@800;900&family=Nunito:wght@800;900&display=swap');
        
        body, html {
            margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden;
            font-family: 'Nunito', 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, #fdf4ff 0%, #d8b4fe 100%);
            touch-action: none; user-select: none; -webkit-user-select: none;
        }

        .glass-hud {
            position: absolute; top: 0; left: 0; width: 100%;
            background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(12px);
            border-bottom: 2px solid rgba(255, 255, 255, 0.6); z-index: 20;
            display: flex; align-items: center; justify-content: space-between; padding: 10px 20px;
        }

        .chat-bubble {
            background: white; border-radius: 20px; padding: 10px 15px; font-weight: 900; color: #4c1d95; position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .chat-bubble::after {
            content: ''; position: absolute; left: -10px; top: 50%; transform: translateY(-50%);
            border-width: 8px 10px 8px 0; border-style: solid; border-color: transparent white transparent transparent;
        }

        /* Target Emoji */
        #target-area {
            position: absolute; top: 15vh; left: 50%; transform: translateX(-50%);
            width: 150px; height: 150px; display: flex; justify-content: center; align-items: center;
            font-size: 8rem; filter: drop-shadow(0 10px 10px rgba(0,0,0,0.2));
            z-index: 10;
        }
        .mystery-box {
            width: 120px; height: 120px; background: linear-gradient(135deg, #c084fc, #9333ea);
            border: 6px solid #581c87; border-radius: 24px; display: flex; justify-content: center; align-items: center;
            font-size: 4rem; color: white; box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            animation: float 3s infinite ease-in-out;
        }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }

        /* Block Building Area */
        #build-area {
            position: absolute; top: 38vh; left: 50%; transform: translateX(-50%);
            display: flex; gap: 5px; height: 100px; align-items: flex-end; justify-content: center;
        }

        .built-block {
            width: 80px; height: 80px; border-radius: 12px; display: flex; justify-content: center; align-items: center;
            font-size: 3.5rem; font-weight: 900; color: white;
            box-shadow: 0 6px 0 rgba(0,0,0,0.2); position: relative;
            animation: blockPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes blockPop { 0% { transform: scale(0) translateY(50px); } 100% { transform: scale(1) translateY(0); } }

        .type-sheng { background: #22c55e; border: 4px solid #14532d; } /* 聲母 綠色 */
        .type-yun { background: #eab308; border: 4px solid #713f12; }  /* 韻母 黃色 */
        .type-tone { background: #ef4444; border: 4px solid #7f1d1d; position: absolute; top: -30px; right: -20px; width: 40px; height: 40px; font-size: 2rem; border-radius: 50%; } /* 聲調 紅色貼紙 */

        /* Keyboard Area */
        #keyboard-area {
            position: absolute; bottom: 5vh; left: 50%; transform: translateX(-50%);
            width: 95vw; max-width: 600px;
            background: rgba(255,255,255,0.7); border: 4px solid #d8b4fe; border-radius: 24px;
            padding: 15px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;
            box-shadow: 0 10px 30px rgba(147, 51, 234, 0.2);
        }

        .key-btn {
            width: 65px; height: 65px; border-radius: 16px; font-size: 2.5rem; font-weight: 900;
            display: flex; justify-content: center; align-items: center; cursor: pointer;
            transition: all 0.1s;
        }
        .key-btn:active { transform: translateY(4px); }
        .key-sheng { background: linear-gradient(135deg, #4ade80, #22c55e); border: 3px solid #14532d; box-shadow: 0 6px 0 #14532d; color: white; }
        .key-yun { background: linear-gradient(135deg, #fde047, #eab308); border: 3px solid #713f12; box-shadow: 0 6px 0 #713f12; color: #422006; }
        .key-tone { background: linear-gradient(135deg, #f87171, #ef4444); border: 3px solid #7f1d1d; box-shadow: 0 6px 0 #7f1d1d; color: white; width: 50px; height: 50px; font-size: 1.5rem; border-radius: 50%; }

        #start-screen { background: radial-gradient(circle at center, #c084fc, #581c87); }
        .btn-action { background: linear-gradient(to bottom, #f472b6, #db2777); box-shadow: 0 8px 0 0 #831843; color: white; }
        .btn-action:active { transform: translateY(6px); box-shadow: 0 2px 0 0 #831843; }
    </style>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#581c87">
</head>
<body>

<a href="index.html" style="position: fixed; bottom: 20px; right: 20px; z-index: 99999; background: rgba(0,0,0,0.4); color: white; padding: 10px 20px; border-radius: 9999px; font-size: 18px; text-decoration: none; font-weight: 900; backdrop-filter: blur(10px); border: 2px solid rgba(255,255,255,0.4);" oncontextmenu="return false;">🏠 回大世界</a>

    <div class="glass-hud">
        <div class="flex items-center gap-4">
            <div class="w-16 h-16 bg-white rounded-full flex items-center justify-center text-4xl shadow-lg border-4 border-purple-500 cursor-pointer" onclick="speak('選出對的積木，拼出注音魔法！')">
                🐦
            </div>
            <div class="chat-bubble" id="abu-dialog">選出對的注音積木，變出物品！</div>
        </div>
        <div class="text-purple-100 text-2xl font-black bg-purple-900/50 px-4 py-2 rounded-full border-2 border-purple-500" id="stars-display">⭐⭐⭐⭐⭐</div>
    </div>

    <!-- Gameplay Area -->
    <div id="target-area">
        <div class="mystery-box" id="mystery-box">❓</div>
    </div>

    <div id="build-area">
        <!-- Built blocks will appear here -->
    </div>

    <div id="keyboard-area">
        <!-- Keys injected by JS -->
    </div>

    <!-- Start Screen -->
    <div id="start-screen" class="absolute inset-0 z-[100] flex flex-col items-center justify-center text-center p-8">
        <h1 class="text-5xl sm:text-7xl font-black text-white drop-shadow-2xl mb-4">阿布魔法注音</h1>
        <p class="text-2xl sm:text-3xl text-purple-200 font-bold mb-12">積木組合拼拼看 🔠</p>
        <button onclick="initGame()" class="btn-action text-4xl font-black px-16 py-6 rounded-full">開始施法！</button>
    </div>

    <script>
        const words = [
            { word: "狗", sheng: "ㄍ", yun: "ㄡ", tone: "ˇ", emoji: "🐶" },
            { word: "貓", sheng: "ㄇ", yun: "ㄠ", tone: "1", emoji: "🐱" }, // 1 means no tone mark
            { word: "車", sheng: "ㄔ", yun: "ㄜ", tone: "1", emoji: "🚗" },
            { word: "花", sheng: "ㄏ", yun: "ㄨㄚ", tone: "1", emoji: "🌸" }, // 結合韻 simplified for this level
            { word: "樹", sheng: "ㄕ", yun: "ㄨ", tone: "ˋ", emoji: "🌳" },
            { word: "星", sheng: "ㄒ", yun: "ㄧㄥ", tone: "1", emoji: "⭐" },
            { word: "豬", sheng: "ㄓ", yun: "ㄨ", tone: "1", emoji: "🐷" },
            { word: "馬", sheng: "ㄇ", yun: "ㄚ", tone: "ˇ", emoji: "🐴" }
        ];

        let currentLevel = 0;
        let activeWords = [];
        let cw = null; // current word object

        let step = 0; // 0: wait sheng, 1: wait yun, 2: wait tone

        function initGame() {
            document.getElementById('start-screen').style.display = 'none';
            activeWords = words.sort(() => 0.5 - Math.random()).slice(0, 5);
            currentLevel = 0;
            loadLevel();
        }

        function loadLevel() {
            if(currentLevel >= 5) {
                if(window.speak) window.speak("太厲害了！你變出了所有魔法物品！");
                setTimeout(() => { document.getElementById('start-screen').style.display = 'flex'; }, 2000);
                return;
            }

            let stars = '';
            for(let i=0; i<5; i++) stars += i < currentLevel ? '🌟' : '⚪';
            document.getElementById('stars-display').innerText = stars;

            cw = activeWords[currentLevel];
            step = 0;

            document.getElementById('target-area').innerHTML = '<div class="mystery-box" id="mystery-box">❓</div>';
            document.getElementById('build-area').innerHTML = '';

            if(window.speak) window.speak(`請拼出「${cw.word}」的注音！`);

            generateKeyboard();
        }

        function generateKeyboard() {
            const kb = document.getElementById('keyboard-area');
            kb.innerHTML = '';

            let shengList = [cw.sheng];
            let yunList = [cw.yun];
            let toneList = ['1', 'ˊ', 'ˇ', 'ˋ', '˙'];

            // Add distractors
            const shengPool = ['ㄅ','ㄆ','ㄇ','ㄈ','ㄉ','ㄊ','ㄋ','ㄌ','ㄍ','ㄎ','ㄏ','ㄐ','ㄑ','ㄒ','ㄓ','ㄔ','ㄕ','ㄖ','ㄗ','ㄘ','ㄙ'];
            const yunPool = ['ㄚ','ㄛ','ㄜ','ㄝ','ㄞ','ㄟ','ㄠ','ㄡ','ㄢ','ㄣ','ㄤ','ㄥ','ㄦ','ㄧ','ㄨ','ㄩ'];
            
            while(shengList.length < 4) {
                let r = shengPool[Math.floor(Math.random()*shengPool.length)];
                if(!shengList.includes(r)) shengList.push(r);
            }
            while(yunList.length < 4) {
                let r = yunPool[Math.floor(Math.random()*yunPool.length)];
                if(!yunList.includes(r)) yunList.push(r);
            }

            shengList.sort(() => 0.5 - Math.random());
            yunList.sort(() => 0.5 - Math.random());

            let allKeys = [];
            
            if(step === 0) {
                shengList.forEach(k => allKeys.push({type: 'sheng', val: k}));
            } else if (step === 1) {
                yunList.forEach(k => allKeys.push({type: 'yun', val: k}));
            } else if (step === 2) {
                toneList.forEach(k => allKeys.push({type: 'tone', val: k}));
            }

            allKeys.forEach(k => {
                const btn = document.createElement('div');
                btn.className = `key-btn key-${k.type}`;
                btn.innerText = k.val === '1' ? '無' : k.val; // '1' is first tone
                btn.onclick = () => handleKey(k);
                kb.appendChild(btn);
            });
        }

        function handleKey(k) {
            playTick();
            let correct = false;
            if(step === 0 && k.type === 'sheng' && k.val === cw.sheng) correct = true;
            if(step === 1 && k.type === 'yun' && k.val === cw.yun) correct = true;
            if(step === 2 && k.type === 'tone' && k.val === cw.tone) correct = true;

            if(correct) {
                addBlockToArea(k);
                step++;
                if(step === 3) {
                    document.getElementById('keyboard-area').innerHTML = ''; // Hide keyboard
                    handleVictory();
                } else {
                    generateKeyboard(); // Next step keys
                }
            } else {
                playError();
                if(window.speak) window.speak("積木顏色或形狀不對喔！再試試看！");
                gsap.fromTo('#keyboard-area', {x: -10}, {x: 10, yoyo: true, repeat: 3, duration: 0.05});
            }
        }

        function addBlockToArea(k) {
            const ba = document.getElementById('build-area');
            if(k.type === 'sheng' || k.type === 'yun') {
                const b = document.createElement('div');
                b.className = `built-block type-${k.type}`;
                b.innerText = k.val;
                if(k.type === 'yun') b.id = 'yun-block';
                ba.appendChild(b);
            } else if (k.type === 'tone') {
                // Attach to Yun
                const yun = document.getElementById('yun-block');
                if(yun && k.val !== '1') {
                    const t = document.createElement('div');
                    t.className = 'built-block type-tone';
                    t.innerText = k.val;
                    yun.appendChild(t);
                }
            }
        }

        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let actx;
        function getActx() { if(!actx) actx = new AudioCtx(); return actx; }
        
        function playTick() {
            const ctx = getActx(); const osc = ctx.createOscillator(); osc.connect(ctx.destination);
            osc.frequency.value = 800; osc.start(); osc.stop(ctx.currentTime + 0.05);
        }
        function playError() {
            const ctx = getActx(); const osc = ctx.createOscillator(); osc.connect(ctx.destination);
            osc.type = 'sawtooth'; osc.frequency.value = 200; osc.start(); osc.stop(ctx.currentTime + 0.1);
        }

        function handleVictory() {
            confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
            if(window.speak) window.speak(`魔法成功！變出了${cw.word}！`);
            
            const tgt = document.getElementById('target-area');
            gsap.to('#mystery-box', {scale: 0, rotation: 360, duration: 0.5, onComplete: () => {
                tgt.innerHTML = `<div id="mystery-box" style="font-size:8rem; animation: bounce 1s infinite alternate ease-in-out;">${cw.emoji}</div>`;
                gsap.fromTo(tgt.firstElementChild, {scale: 0}, {scale: 1, duration: 0.5, ease: "elastic.out"});
            }});

            setTimeout(() => {
                currentLevel++;
                loadLevel();
            }, 3000);
        }
    </script>
</body>
</html>
