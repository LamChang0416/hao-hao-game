<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>阿布的星際煉金爐</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            touch-action: none;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            background: radial-gradient(circle at center, #1E3A8A, #020617);
            color: white;
            height: 100vh;
            margin: 0;
        }

        /* 動畫效果 */
        .float-anim {
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-15px);
            }
        }

        .pulse-glow {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
            }

            50% {
                box-shadow: 0 0 30px rgba(59, 130, 246, 0.9);
            }

            100% {
                box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
            }
        }

        .shake-gentle {
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            75% {
                transform: translateX(5px);
            }
        }

        .fuse-anim {
            animation: fuse 1s forwards;
        }

        @keyframes fuse {
            0% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.2);
                opacity: 0.8;
                filter: brightness(1.5);
            }

            100% {
                transform: scale(0);
                opacity: 0;
            }
        }

        .crystal-appear {
            animation: appear 1s forwards;
        }

        @keyframes appear {
            0% {
                transform: scale(0) rotate(0deg);
                opacity: 0;
            }

            50% {
                transform: scale(1.2) rotate(180deg);
                opacity: 1;
            }

            100% {
                transform: scale(1) rotate(360deg);
                opacity: 1;
            }
        }

        /* Fat Finger 按鈕設計 */
        .fat-btn {
            width: 100px;
            height: 100px;
            border-radius: 24px;
            font-size: 3rem;
            font-weight: 900;
            box-shadow: 0 10px 0 rgba(0, 0, 0, 0.3);
            transition: all 0.1s;
        }

        .fat-btn:active {
            transform: translateY(10px);
            box-shadow: 0 0 0 rgba(0, 0, 0, 0);
        }

        /* 寶石與水晶 */
        .red-stone {
            width: 40px;
            height: 40px;
            background: radial-gradient(circle at 30% 30%, #FCA5A5, #EF4444, #991B1B);
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.6);
        }

        .blue-crystal {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #93C5FD, #3B82F6, #1E3A8A);
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            box-shadow: 0 0 40px rgba(59, 130, 246, 0.8);
            position: absolute;
            top: 50%;
            left: 50%;
            margin-top: -60px;
            margin-left: -60px;
            z-index: 10;
        }
    </style>
</head>

<body class="flex flex-col items-center justify-center">

    <div id="start-screen"
        class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-slate-900 bg-opacity-90 backdrop-blur-sm p-10 text-center">
        <h1 class="text-6xl font-black mb-6 text-blue-400 drop-shadow-lg">阿布的星際煉金爐</h1>
        <div class="text-9xl mb-8 float-anim">🚀🐦</div>
        <p class="text-3xl mb-12 text-blue-100 font-bold">澔澔，太空船沒電了！<br><br>我們來把紅礦石煉成藍水晶吧！</p>
        <button onclick="startGame()"
            class="bg-gradient-to-r from-yellow-400 to-orange-500 hover:from-yellow-300 hover:to-orange-400 text-white px-20 py-8 rounded-[40px] text-5xl font-black shadow-[0_10px_0_#9A3412] active:translate-y-[10px] active:shadow-none transition-all border-4 border-yellow-200">
            開始探險！
        </button>
    </div>

    <div class="w-full max-w-4xl px-6 flex flex-col items-center relative h-full py-8">

        <div
            class="w-full bg-slate-800 h-8 rounded-full mb-6 border-4 border-slate-600 shadow-inner relative overflow-hidden">
            <div id="progress-bar"
                class="bg-gradient-to-r from-green-400 to-emerald-500 h-full transition-all duration-700 w-0"></div>
            <div
                class="absolute inset-0 flex justify-center items-center text-xs font-bold text-white/50 tracking-widest">
                能量收集進度</div>
        </div>

        <div class="flex items-end mb-6 space-x-6 w-full px-4">
            <div id="abu-sprite" class="text-8xl float-anim drop-shadow-[0_0_20px_rgba(255,255,255,0.3)]">🐦</div>
            <div class="bg-white/10 backdrop-blur-md p-6 rounded-[30px] border-4 border-blue-400/50 relative flex-1">
                <p id="abu-text" class="text-3xl font-black text-blue-100 tracking-wide">澔澔準備好了嗎？</p>
                <div
                    class="absolute bottom-6 -left-5 w-6 h-6 bg-white/10 border-l-4 border-b-4 border-blue-400/50 transform rotate-45 backdrop-blur-md">
                </div>
            </div>
        </div>

        <div
            class="bg-slate-800/80 p-8 rounded-[40px] border-8 border-slate-600 shadow-[0_0_50px_rgba(0,0,0,0.5)] flex flex-col items-center mb-8 relative w-[600px] h-[320px] justify-center pulse-glow">

            <div
                class="absolute -top-8 bg-blue-600 text-white px-8 py-2 rounded-full text-3xl font-black border-4 border-blue-300 shadow-lg">
                <span id="eq-num1">0</span> + <span id="eq-target" class="text-yellow-300">?</span> = 10
            </div>

            <div id="furnace-grid" class="grid grid-cols-5 gap-4">
            </div>

            <div id="blue-crystal" class="blue-crystal hidden"></div>
        </div>

        <div id="options" class="flex justify-center space-x-6 w-full">
        </div>

    </div>

    <div id="milestone-screen"
        class="fixed inset-0 z-50 hidden flex flex-col items-center justify-center bg-slate-900 bg-opacity-95 p-10 text-center">
        <div class="text-[150px] mb-8 float-anim scale-150">🦸‍♂️</div>
        <h1 class="text-7xl font-black mb-6 text-yellow-400 drop-shadow-[0_0_20px_rgba(250,204,21,0.8)]">宇宙大英雄！</h1>
        <p class="text-4xl text-white font-bold mb-12 leading-relaxed">澔澔太不可思議了！<br>你幫阿布收集滿了所有能量！</p>
        <button onclick="resetGame()"
            class="bg-blue-500 hover:bg-blue-400 text-white px-16 py-6 rounded-[30px] text-4xl font-black shadow-[0_10px_0_#1E3A8A] active:translate-y-[10px] active:shadow-none transition-all">
            繼續下一趟冒險
        </button>
    </div>

    <script>
        const state = {
            level: 1,
            maxLevel: 10,
            currentStones: 0,
            targetNeed: 0,
            isAnimating: false,
            synth: window.speechSynthesis
        };

        const abuSpeak = (text, rate = 1.15) => {
            if (state.synth.speaking) state.synth.cancel();
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'zh-TW';
            utter.rate = rate;
            utter.pitch = 1.2; // 讓聲音稍微可愛一點
            state.synth.speak(utter);
            document.getElementById('abu-text').innerText = text;
        };

        function startGame() {
            // 解鎖語音權限
            const unlock = new SpeechSynthesisUtterance('');
            state.synth.speak(unlock);

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('abu-sprite').innerText = "👨‍🚀";

            abuSpeak("太空船啟動！澔澔，看圖上有幾顆紅礦石，幫我湊成十顆吧！");
            setTimeout(nextLevel, 3500);
        }

        function nextLevel() {
            if (state.level > state.maxLevel) {
                celebrateMilestone();
                return;
            }

            state.isAnimating = false;
            document.getElementById('progress-bar').style.width = `${((state.level - 1) / state.maxLevel) * 100}%`;
            document.getElementById('blue-crystal').classList.add('hidden');
            document.getElementById('blue-crystal').classList.remove('crystal-appear');
            document.getElementById('abu-sprite').innerText = "👨‍🚀";
            document.getElementById('eq-target').innerText = "?";
            document.getElementById('eq-target').classList.remove('text-green-400');
            document.getElementById('eq-target').classList.add('text-yellow-300');

            // 產生題目 (X + Y = 10)
            state.currentStones = Math.floor(Math.random() * 9) + 1; // 1~9
            state.targetNeed = 10 - state.currentStones;
            document.getElementById('eq-num1').innerText = state.currentStones;

            renderFurnace(state.currentStones);
            generateOptions(state.targetNeed);

            if (state.level > 1) {
                abuSpeak("還需要幾顆才能煉出藍水晶呢？");
            }
        }

        function renderFurnace(stoneCount) {
            const grid = document.getElementById('furnace-grid');
            grid.innerHTML = '';

            for (let i = 0; i < 10; i++) {
                const slot = document.createElement('div');
                slot.className = "w-[60px] h-[60px] rounded-full border-4 border-slate-600 bg-slate-700/50 flex items-center justify-center shadow-inner";

                if (i < stoneCount) {
                    const stone = document.createElement('div');
                    stone.className = "red-stone";
                    slot.appendChild(stone);
                }
                grid.appendChild(slot);
            }
        }

        function generateOptions(correctAnswer) {
            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = '';

            // 產生包含正確答案的 4 個選項
            let choices = new Set([correctAnswer]);
            while (choices.size < 4) {
                let randomWrong = Math.floor(Math.random() * 9) + 1;
                choices.add(randomWrong);
            }

            // 打亂陣列
            let shuffled = Array.from(choices).sort(() => Math.random() - 0.5);

            shuffled.forEach(num => {
                const btn = document.createElement('button');
                btn.className = "fat-btn bg-white text-blue-900 border-b-8 border-gray-300";
                btn.innerText = num;
                btn.onclick = () => checkAnswer(num, btn);
                optionsDiv.appendChild(btn);
            });
        }

        function checkAnswer(choice, btnElement) {
            if (state.isAnimating) return; // 防止狂點

            if (choice === state.targetNeed) {
                state.isAnimating = true;

                // 1. 答對微反饋
                abuSpeak(`澔澔太神了！就是 ${choice}！開始煉金！`, 1.2);
                document.getElementById('abu-sprite').innerText = "🤩";
                document.getElementById('eq-target').innerText = choice;
                document.getElementById('eq-target').classList.remove('text-yellow-300');
                document.getElementById('eq-target').classList.add('text-green-400');
                document.getElementById('options').innerHTML = ''; // 隱藏選項

                // 2. 補滿紅礦石動畫
                renderFurnace(10);
                const allStones = document.querySelectorAll('.red-stone');

                // 3. 觸發融合特效
                setTimeout(() => {
                    allStones.forEach(stone => stone.classList.add('fuse-anim'));

                    // 噴發微量碎屑
                    confetti({ particleCount: 30, spread: 60, origin: { y: 0.6 }, colors: ['#EF4444', '#FCA5A5'] });

                    setTimeout(() => {
                        // 4. 變出藍水晶
                        document.getElementById('furnace-grid').innerHTML = '';
                        const crystal = document.getElementById('blue-crystal');
                        crystal.classList.remove('hidden');
                        crystal.classList.add('crystal-appear');

                        // 藍水晶特效
                        confetti({ particleCount: 80, spread: 100, origin: { y: 0.5 }, colors: ['#3B82F6', '#93C5FD', '#FFFFFF'] });

                        setTimeout(() => {
                            state.level++;
                            nextLevel();
                        }, 2500);

                    }, 1000); // 等待融合動畫結束
                }, 1000); // 讓玩家先看清楚補滿10顆的樣子

            } else {
                // 答錯溫柔引導
                document.getElementById('abu-sprite').innerText = "🤔";
                abuSpeak(`差一點點！${choice} 放進去好像不會剛好滿喔，我們再看一次空格有幾個！`);

                // 按鈕輕微抖動視覺提示
                btnElement.classList.add('shake-gentle');
                btnElement.classList.replace('bg-white', 'bg-orange-100');
                setTimeout(() => {
                    btnElement.classList.remove('shake-gentle');
                    btnElement.classList.replace('bg-orange-100', 'bg-white');
                    document.getElementById('abu-sprite').innerText = "👨‍🚀";
                }, 500);
            }
        }

        function celebrateMilestone() {
            document.getElementById('progress-bar').style.width = '100%';
            document.getElementById('milestone-screen').classList.remove('hidden');

            abuSpeak("哇！十顆藍水晶都收集到了！澔澔你是全宇宙最厲害的超級大英雄！阿布最喜歡跟你一起冒險了！", 1.1);

            // 全螢幕持續紙屑噴發
            const duration = 6 * 1000;
            const end = Date.now() + duration;

            (function frame() {
                confetti({ particleCount: 8, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#FBBF24', '#3B82F6', '#EF4444'] });
                confetti({ particleCount: 8, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#FBBF24', '#3B82F6', '#EF4444'] });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }

        function resetGame() {
            state.level = 1;
            document.getElementById('milestone-screen').classList.add('hidden');
            nextLevel();
        }
    </script>
</body>

</html>
