*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito','Noto Sans TC',sans-serif;min-height:100vh;
  background:linear-gradient(135deg,#1a0533 0%,#3d1066 50%,#1a0533 100%);

.screen{position:fixed;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:16px;gap:12px;}
.hidden{display:none!important;}
.btn{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#1c1917;
  font-weight:900;font-size:1.4rem;padding:14px 36px;border-radius:99px;
  border:none;cursor:pointer;box-shadow:0 6px 0 #92400e;
  transition:all .1s;font-family:inherit;width:100%;max-width:340px;}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #92400e;}
.btn-sm{font-size:1.1rem;padding:10px 24px;}
.btn-ghost{background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.3);

  cursor:pointer;font-family:inherit;font-weight:700;box-shadow:none;}
.bubble{background:white;color:#1e293b;border-radius:18px;padding:10px 16px;

.num{font-size:clamp(3rem,10vw,5rem);font-weight:900;line-height:1;transition:color .3s;}
.num.big{color:#fbbf24;}
.num.small{color:#60a5fa;}
.num.ans{color:#4ade80;}
.num.dim{color:rgba(255,255,255,.2);}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.bob{animation:bob 2.5s ease-in-out infinite;}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.25)}100%{transform:scale(1)}}
.pop{animation:pop .25s ease;}
/* Hand SVG */
.hand-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;}
.hand-label{font-size:.8rem;font-weight:900;color:#e9d5ff;}
/* Answer buttons */
.ans-btn{background:rgba(255,255,255,.12);border:3px solid rgba(255,255,255,.3);
  color:white;font-size:2.2rem;font-weight:900;padding:14px 28px;border-radius:16px;

.ans-btn:hover,.ans-btn:active{background:rgba(251,191,36,.3);border-color:#fbbf24;transform:scale(1.06);}
.ans-btn.ok{background:rgba(74,222,128,.4);border-color:#4ade80;}
.ans-btn.no{background:rgba(239,68,68,.3);border-color:#ef4444;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.shake{animation:shake .4s ease;}
/* Rule card */
.rule-card{background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.2);
  border-radius:16px;padding:12px 20px;text-align:center;font-size:1.1rem;font-weight:800;}
</style>

        <rect x="18" y="40" width="64" height="10" rx="5" fill="#7c3aed"/>
        <circle cx="50" cy="67" r="30" fill="#333"/>
        <circle cx="39" cy="64" r="6.5" fill="white"/><circle cx="40" cy="64" r="3" fill="#111"/>
        <circle cx="61" cy="64" r="6.5" fill="white"/><circle cx="60" cy="64" r="3" fill="#111"/>
        <path d="M42 76 Q50 84 58 76" stroke="#fbbf24" stroke-width="3" fill="none" stroke-linecap="round"/>

<script>
// ===== HAND DRAWING =====
// Fingers: [thumb, index, middle, ring, pinky]
// count=1→index, 2→+middle, 3→+ring, 4→+pinky, 5→all(+thumb)
const FINGER_DEFS = [
  {x:8,  y:42, w:16, h:56}, // thumb
  {x:28, y:10, w:16, h:82}, // index
  {x:48, y:4,  w:16, h:88}, // middle
  {x:68, y:10, w:16, h:82}, // ring
  {x:88, y:24, w:14, h:68}, // pinky
];

function isFingerUp(fingerIdx, count) {
  // fingerIdx: 0=thumb,1=index,2=middle,3=ring,4=pinky
  if (count === 5) return true;
  // count 1-4: raise index(1), middle(2), ring(3), pinky(4)
  return fingerIdx >= 1 && fingerIdx <= count;
}

function makeHandSVG(count, flip=false) {
  count = Math.max(0, Math.min(5, count));
  const w=114, h=175;
  let svg = `<svg viewBox="0 0 ${w} ${h}" width="100" height="156"
    style="display:block;${flip?'transform:scaleX(-1);':''}" xmlns="http://www.w3.org/2000/svg">`;
  // Palm
  svg += `<rect x="5" y="105" width="104" height="65" rx="18" fill="#FFCBA4" stroke="#C68642" stroke-width="2.5"/>`;
  // Fingers (draw behind palm for folded, above for up)
  for (let i=0; i<5; i++) {
    const f=FINGER_DEFS[i];
    const up = isFingerUp(i, count);
    if (up) {
      // Full finger + rounded tip
      const joinY = 107;
      const totalH = joinY - f.y + f.w/2;
      svg += `<rect x="${f.x}" y="${f.y+f.w/2}" width="${f.w}" height="${totalH}" rx="${f.w/2}"
        fill="#FFCBA4" stroke="#C68642" stroke-width="2.2"/>`;
      svg += `<circle cx="${f.x+f.w/2}" cy="${f.y+f.w/2}" r="${f.w/2}"
        fill="#FFCBA4" stroke="#C68642" stroke-width="2.2"/>`;
      // Knuckle line
      svg += `<line x1="${f.x+3}" y1="${f.y+f.w+14}" x2="${f.x+f.w-3}" y2="${f.y+f.w+14}"
        stroke="#C68642" stroke-width="1.2" stroke-linecap="round" opacity=".5"/>`;
    }
  }
  // Palm overlay (covers base of fingers)
  svg += `<rect x="5" y="105" width="104" height="65" rx="18" fill="#FFCBA4" stroke="#C68642" stroke-width="2.5"/>`;
  // Thumb crease
  svg += `<path d="M24 120 Q18 135 22 155" stroke="#C68642" stroke-width="1.5" fill="none" opacity=".4"/>`;
  // Palm lines
  svg += `<path d="M20 130 Q60 125 95 135" stroke="#C68642" stroke-width="1.2" fill="none" opacity=".35"/>`;
  svg += `<path d="M18 148 Q55 143 98 150" stroke="#C68642" stroke-width="1.2" fill="none" opacity=".25"/>`;
  svg += `</svg>`;
  return svg;
}

function drawHands(count, animate=false) {
  const lc = document.getElementById('lhand-wrap');
  const rh = document.getElementById('rhand');
  const rl = document.getElementById('rhand-label');

  if (count <= 5) {
    lc.classList.add('hidden');
    rh.innerHTML = makeHandSVG(count);
    rl.textContent = count > 0 ? `右手 ${count}` : '✊ 零根';
  } else {
    lc.classList.remove('hidden');
    document.getElementById('lhand').innerHTML = makeHandSVG(5);
    const rightCount = count - 5;
    rh.innerHTML = makeHandSVG(rightCount);
    rl.textContent = `右手 ${rightCount}`;
  }

  if (animate) {
    const targets = ['#rhand svg', '#lhand svg'].filter(s => document.querySelector(s));
    targets.forEach(t => gsap.fromTo(t, {scale:.6,opacity:0},{scale:1,opacity:1,duration:.4,ease:'back.out(2)'}));
  }
}

// Animate folding one finger: from `from` count down to `to`
function foldFinger(curCount) {
  // We need to update the hand to show curCount - we do a quick scale flash
  drawHands(curCount);
  gsap.fromTo('#rhand', {scale:1.1},{scale:1,duration:.25,ease:'power2.out'});
}

// ===== SPEECH =====
function speak(text) {
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-TW'; u.rate = 1.0;
  window.speechSynthesis.speak(u);
}
function bubble(id, text) { document.getElementById(id).textContent = text; }
function pokeAbu(ctx) {
  const msgs = ['澔澔超厲害！','加油！你可以的！','大的念嘴巴，小的比出來！','一步一步來！'];
  const t = msgs[Math.floor(Math.random()*msgs.length)];
  bubble(ctx==='start'?'b-start':'b-game', t); speak(t);
}

// ===== SCREEN =====
function show(id) {
  ['s-start','s-levels','s-game','s-victory'].forEach(s=>
    document.getElementById(s).classList.toggle('hidden', s!==id));
}
function goLevels() { show('s-levels'); }

// ===== LEVEL DATA =====
let G = {}; // game state

function genProblems(lvl) {
  const cfg = [{},{maxS:3,maxB:9},{maxS:5,maxB:12},{maxS:9,maxB:15}][lvl];
  const out = [], used = new Set();
  let tries = 0;
  while (out.length < 8 && tries < 200) {
    tries++;
    const s = 1 + Math.floor(Math.random() * cfg.maxS);
    const b = s + 1 + Math.floor(Math.random() * (cfg.maxB - s));
    if (b + s > 20 || b <= s) continue;
    const k = `${b}+${s}`;
    if (!used.has(k)) { used.add(k); out.push({big:b, small:s, ans:b+s}); }
  }
  return out;
}

function startLevel(lvl) {
  G = {
    lvl, probs: genProblems(lvl),
    idx: 0,       // current problem index
    mode: 'teach',// teach (0-2) or practice (3-7)
    phase: 'idle',// idle, reveal, counting, answered
    mouthN: 0,
    fingerN: 0,
    counting: false,
  };
  show('s-game');
  loadProblem();
}

function loadProblem() {
  const p = G.probs[G.idx];
  G.big = p.big; G.small = p.small; G.ans = p.ans;
  G.mouthN = p.big; G.fingerN = p.small;
  G.phase = 'idle';
  G.counting = false;

  G.mode = G.idx < 3 ? 'teach' : 'practice';

  document.getElementById('mode-tag').textContent = G.mode==='teach' ? '👀 阿布示範' : '✏️ 澔澔練習';
  document.getElementById('d-big').textContent = G.big;
  document.getElementById('d-small').textContent = G.small;
  document.getElementById('d-ans').textContent = '?';
  document.getElementById('d-ans').className = 'num dim';
  document.getElementById('mouth-box').textContent = G.big;

  // Progress dots
  const isT = G.mode==='teach';
  const total = isT ? 3 : 5, cur = isT ? G.idx : G.idx-3;
  document.getElementById('prog').textContent = Array.from({length:total},(_, i)=>
    i < cur ? '⭐' : i === cur ? '🌟' : '⚪').join('');

  drawHands(G.small);
  updateRightLabel(G.small);

  if (G.mode === 'teach') startTeach();
  else startPractice();
}

function updateRightLabel(n) {
  document.getElementById('rhand-label').textContent =
    n <= 0 ? '✊ 歸零！' : n <= 5 ? `右手 ${n}` : `右手 ${n-5}`;
}

// ===== TEACH MODE =====
function startTeach() {
  showBtn('teach');
  document.getElementById('btn-teach').textContent = '開始！▶';
  G.phase = 'intro';
  const t = `這題是 ${G.big} 加 ${G.small}！${G.big} 比較大，嘴巴念 ${G.big}；${G.small} 比較小，手指比 ${G.small}！`;
  bubble('b-game', t); speak(t);
}

let teachTimer = null;
function doTeachStep() {
  clearTimeout(teachTimer);
  if (G.phase === 'intro') {
    G.phase = 'counting';
    document.getElementById('btn-teach').textContent = '⏳ 數數中…';
    document.getElementById('btn-teach').disabled = true;
    const t = `嘴巴從 ${G.big} 開始，一邊念，一邊折手指！`;
    bubble('b-game', t); speak(t);
    teachCounting();
  } else if (G.phase === 'done') {
    advance();
  }
}

async function teachCounting() {
  await delay(900);
  while (G.fingerN > 0) {
    G.mouthN++; G.fingerN--;
    pulseMouth(G.mouthN);
    speak(`${G.mouthN}`);
    foldFinger(G.fingerN);
    updateRightLabel(G.fingerN);
    await delay(950);
  }
  // Show answer
  document.getElementById('d-ans').textContent = G.ans;
  document.getElementById('d-ans').className = 'num ans';
  gsap.fromTo('#d-ans',{scale:.4,opacity:0},{scale:1,opacity:1,duration:.5,ease:'back.out(2)'});
  confetti({particleCount:40,spread:60,origin:{y:.6}});
  const t = `手指歸零！${G.big} 加 ${G.small} 等於 ${G.ans}！`;
  bubble('b-game', t); speak(t);
  G.phase = 'done';
  document.getElementById('btn-teach').textContent = '繼續 →';
  document.getElementById('btn-teach').disabled = false;
}

// ===== PRACTICE MODE =====
function startPractice() {
  showBtn('count');
  document.getElementById('btn-count').textContent = `☝️ 折一根手指（${G.fingerN} 根）`;
  const t = `換澔澔來！嘴巴念 ${G.big}，手指比 ${G.small} 根，開始！`;
  bubble('b-game', t); speak(t);
}

function doCount() {
  if (G.fingerN <= 0) return;
  G.mouthN++; G.fingerN--;
  pulseMouth(G.mouthN);
  speak(`${G.mouthN}`);
  foldFinger(G.fingerN);
  updateRightLabel(G.fingerN);

  if (G.fingerN > 0) {
    document.getElementById('btn-count').textContent = `☝️ 折一根手指（${G.fingerN} 根）`;
    bubble('b-game', G.fingerN <= 2 ? '快到了！繼續折！' : '很好！繼續！');
  } else {
    showBtn('none');
    bubble('b-game', '手指歸零了！答案是多少？');
    speak('手指歸零了！答案是多少？');
    setTimeout(showAnsChoices, 400);
  }
}

function showAnsChoices() {
  const area = document.getElementById('ans-area');
  area.innerHTML = '';
  area.style.display = 'flex';
  const correct = G.ans;
  const opts = new Set([correct]);
  while (opts.size < 3) {
    const v = correct + (Math.random() > .5 ? 1 : -1) * (1 + Math.floor(Math.random()*3));
    if (v > 0 && v <= 25) opts.add(v);
  }
  [...opts].sort(()=>Math.random()-.5).forEach(v => {
    const b = document.createElement('button');
    b.className = 'ans-btn'; b.textContent = v;
    b.onclick = () => checkAns(b, v, correct);
    area.appendChild(b);
  });
}

function checkAns(btn, val, correct) {
  document.querySelectorAll('.ans-btn').forEach(b => b.onclick = null);
  if (val === correct) {
    btn.classList.add('ok');
    document.getElementById('d-ans').textContent = G.ans;
    document.getElementById('d-ans').className = 'num ans';
    confetti({particleCount:60,spread:70,origin:{y:.6}});
    const t = `✅ 答對了！${G.big} + ${G.small} = ${G.ans}！澔澔好棒！`;
    bubble('b-game', t); speak(t);
    setTimeout(advance, 1800);
  } else {
    btn.classList.add('no');
    btn.classList.add('shake');
    const t = `再想想！手指歸零的時候嘴巴在念多少？`;
    bubble('b-game', t); speak(t);
    setTimeout(() => {
      btn.classList.remove('shake','no');
      document.querySelectorAll('.ans-btn').forEach(b => b.onclick = () => checkAns(b, +b.textContent, correct));
    }, 600);
  }
}

// ===== FLOW =====
function advance() {
  G.idx++;
  if (G.idx === 3) {
    // Transition teach→practice
    bubble('b-game','示範完了！換澔澔來試試！💪');
    speak('示範完了，換澔澔來試試看！');
    setTimeout(loadProblem, 1400);
  } else if (G.idx >= 8) {
    showVictory();
  } else {
    loadProblem();
  }
}

function showVictory() {
  show('s-victory');
  confetti({particleCount:180,spread:100,origin:{y:.5}});
  document.getElementById('v-title').textContent = `第 ${G.lvl} 關完成！🏆`;
  document.getElementById('v-sub').textContent = '澔澔學會了加法魔法！大的念嘴巴，小的比出來！';
  speak(`澔澔太厲害了！第 ${G.lvl} 關完成！你已經學會加法魔法了！`);
}

// ===== HELPERS =====
function pulseMouth(n) {
  const el = document.getElementById('mouth-box');
  el.textContent = n;
  gsap.fromTo(el,{scale:.85,background:'rgba(251,191,36,.5)'},{scale:1,background:'rgba(255,255,255,.15)',duration:.25});
}

function showBtn(which) {
  document.getElementById('btn-teach').style.display = which==='teach' ? 'block' : 'none';
  document.getElementById('btn-count').style.display = which==='count' ? 'block' : 'none';
  const area = document.getElementById('ans-area');
  if (which !== 'ans') { area.style.display = 'none'; area.innerHTML = ''; }
}

function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

window.addEventListener('resize', () => { if (document.getElementById('s-game').style.display!=='none') { drawHands(G.fingerN||G.small); } });
</script>
